<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HDRI Studio</title>
<style>
  :root { --bg: #f3f4f2; --panel: #ffffff; --line: #d6dad5; --fg: #1b1f22; --muted: #5f676d; --accent: #b9770e; --accent-ink: #ffffff; --bad: #c43d3d; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1114; --panel: #161a1f; --line: #2b333c; --fg: #e7eaed; --muted: #919ba5; --accent: #f2b33d; --accent-ink: #1a1406; --bad: #ef6b6b; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 16px; }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 24px; letter-spacing: .01em; }
  h1 span { color: var(--accent); }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  input { font: inherit; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--fg); width: 100%; }
  button { font: 600 15px system-ui, sans-serif; padding: 11px; border-radius: 9px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<form id="f">
  <h1>HDRI <span>Studio</span></h1>
  <p>Esta página está protegida. Escribe la contraseña para abrirla.</p>
  <div style="display:flex;flex-direction:column;gap:6px">
    <label for="pw">Contraseña</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
  </div>
  <button id="go" type="submit">Entrar</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
(() => {
  const ITER = __ITER__;
  const PAYLOAD = "__PAYLOAD__";
  const f = document.getElementById("f"), pw = document.getElementById("pw"), go = document.getElementById("go"), err = document.getElementById("err");
  const bytes = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
  async function open(password) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes.slice(0, 16), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(16, 28) }, key, bytes.slice(28));
    return new TextDecoder().decode(plain);
  }
  f.addEventListener("submit", async e => {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) { err.textContent = "Tu navegador no permite descifrar esta página. Ábrela con https en Chrome, Edge, Firefox o Safari."; return; }
    go.disabled = true; go.textContent = "Abriendo…"; err.textContent = "";
    try {
      const html = await open(pw.value);
      document.open(); document.write(html); document.close();
    } catch (x) {
      err.textContent = "Contraseña incorrecta.";
      go.disabled = false; go.textContent = "Entrar"; pw.select();
    }
  });
})();
</script>
</body>
</html>
