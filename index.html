<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HDRI Studio</title>
<style id="gate-style">
  :root { --bg: #07090b; --panel: #12161a; --line: #2a323b; --fg: #eef1f3; --muted: #95a0aa; --accent: #f2b33d; --accent-ink: #1a1406; --bad: #ef6b6b; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .gate { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 24px; }
  h1 span { color: var(--accent); }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  label.t { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  input[type=password] { font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--fg); width: 100%; }
  .rem { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  .rem input { width: 18px; height: 18px; accent-color: var(--accent); }
  button { font: 600 16px system-ui, sans-serif; padding: 12px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: .6; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="f">
    <h1>HDRI <span>Studio</span></h1>
    <p>Página protegida. Escribe la contraseña para entrar.</p>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label class="t" for="pw">Contraseña</label>
      <input id="pw" type="password" autocomplete="current-password" required>
    </div>
    <label class="rem"><input type="checkbox" id="remember" checked> Recordar en este dispositivo</label>
    <button id="go" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = u8 => btoa(String.fromCharCode(...u8));
  const STORE = "hdri-studio-key";
  const $ = id => document.getElementById(id);

  async function contentKeyFromPassword(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const kek = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(P.wiv) }, kek, unb64(P.wrapped)));
  }
  async function decryptPage(raw) {
    const k = await crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(P.iv) }, k, unb64(P.ct)));
  }
  // Inserta la página descifrada en este mismo documento (sin document.write: compatible con Safari/iPhone).
  function mount(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    document.title = doc.title || document.title;
    $("gate-style").remove();
    for (const n of [...doc.head.children]) if (n.tagName !== "SCRIPT" && n.tagName !== "TITLE" && !(n.tagName === "META" && /charset|viewport/i.test(n.outerHTML))) document.head.appendChild(document.importNode(n, true));
    document.body.innerHTML = "";
    for (const n of [...doc.body.childNodes]) if (n.nodeName !== "SCRIPT") document.body.appendChild(document.importNode(n, true));
    for (const s of doc.querySelectorAll("script")) { const x = document.createElement("script"); if (s.id) x.id = s.id; x.textContent = s.textContent; document.body.appendChild(x); }
  }
  async function tryStored() {
    let saved = null;
    try { saved = localStorage.getItem(STORE); } catch (e) { /* sin almacenamiento */ }
    if (!saved) return false;
    try { mount(await decryptPage(unb64(saved))); return true; }
    catch (e) { try { localStorage.removeItem(STORE); } catch (x) { /* nada */ } return false; }
  }
  if (!window.crypto || !crypto.subtle) { $("err").textContent = "Abre la página con https en Safari, Chrome o Firefox actualizados."; return; }
  tryStored().then(ok => { if (!ok) $("pw").focus(); });
  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    const go = $("go"), err = $("err");
    go.disabled = true; go.textContent = "Abriendo…"; err.textContent = "";
    let raw;
    try { raw = await contentKeyFromPassword($("pw").value); }
    catch (x) { err.textContent = "Contraseña incorrecta."; go.disabled = false; go.textContent = "Entrar"; $("pw").select(); return; }
    if ($("remember").checked) { try { localStorage.setItem(STORE, b64(raw)); } catch (x) { /* sin almacenamiento */ } }
    try { mount(await decryptPage(raw)); }
    catch (x) { err.textContent = "No se pudo abrir la página: " + (x.message || x); go.disabled = false; go.textContent = "Entrar"; }
  });
